# mathpreview viewer configuration
# Save globally for every paper, or to .mathpreview.toml for this project.

[viewer]
font-size = 18
ui-font-size = 12
hover-preview-scale = 100 # Percent of document size; range 100..300.
default-page-mode = "a4"
default-theme = "system"
theorem-numbering = "auto"
fancy-theorems = true # false keeps declared theorems in a plain TeX-like style.
typeset-mode = "local"
# render-tikz = true # Trusted projects only; runs local TeX with shell escape disabled.
# page-margin = 17 # Uncomment to pin the A4 margin in mm; omitted follows geometry.

[viewer.source-jump]
trigger = "cmd-click"

# Markdown custom blocks use `:::` fences by default, including compact
# `:::name Optional title` blocks and Bookdown/Quarto Pandoc attribute fences.
# Set this to false when another Markdown extension owns colon fences; use a
# custom block syntax below for MathPreview-specific containers instead.
[markdown]
colon-fences = true

# Semantic theorem blocks also accept Bookdown `::: {.theorem #key}` and Quarto
# `::: {#thm-key}` Pandoc fences. Built-in semantic names are theorem, lemma,
# corollary, proposition, conjecture, definition, example, exercise,
# hypothesis (Bookdown), remark, solution, algorithm (Quarto), and proof.
# The same entries control their safe presentation. Generic custom blocks are
# not numbered.
# The built-in proof block is unnumbered, starts blurred, and reveals from its
# heading button.
[markdown.blocks.proof]
label = "Proof"
appearance = "plain" # plain | bordered | card
reveal = "blur"      # always | blur
italic = false
# accent = "#2f9e44"    # Optional; only #RGB or #RRGGBB.
# background = "#eefbf1" # Optional; only #RGB or #RRGGBB.

# Restyle a built-in theorem name, or define any 1–32 character custom name
# matching [a-z][a-z0-9_-]*. Styling does not change theorem prefixes or
# numbering rules.
# [markdown.blocks.exercise]
# label = "Exercise"
# appearance = "card"
# reveal = "always"
# accent = "#8a5cd0"
# background = "#f6f1ff"
# italic = false

# Additional custom-block syntaxes match complete marker lines with up to three
# leading spaces. Trailing spaces and tabs are ignored. `start` accepts one
# string or an ordered array. It must capture `{name}` and may later capture
# `{title}`, `{label}`, and `{card}` once each. Labels become safe fragment targets.
# Card captures accept only `true` or `false`. A true value forces card
# presentation, while false keeps the configured appearance. `end` is literal.
# Names still resolve through `[markdown.blocks]`.
# Enable at most 32 syntax IDs matching [a-z][a-z0-9_-]*, with 1–16 starts each.
# Higher config scopes replace a declaration as a unit. Use `enabled = false`
# under the same ID to disable an inherited syntax. List every opener form that
# may be nested under a shared end marker. The markers are not executed as Jinja.
# This Jinja-style example mirrors `result(type, name, label, card)` calls:
# [markdown.block-syntaxes.jinja-result]
# start = [
#   '{% call result("{name}", "{title}", "{label}", card={card}) %}',
#   '{% call result("{name}", "{title}", "{label}") %}',
#   '{% call result("{name}", "{title}", label="{label}", card={card}) %}',
#   '{% call result("{name}", "{title}", label="{label}") %}',
#   '{% call result("{name}", label="{label}", card={card}) %}',
#   '{% call result("{name}", label="{label}", card="{card}") %}',
#   '{% call result("{name}", label="{label}") %}',
#   '{% call result("{name}", "{title}", card={card}) %}',
#   '{% call result("{name}", card={card}) %}',
#   '{% call result("{name}", "{title}") %}',
#   '{% call result("{name}") %}',
# ]
# end = '{% endcall %}'

# One shortcut string or an array is accepted. Use [] to disable an action.
# Removing a key from its action leaves it untouched for the browser or an
# extension. For example, omit `j`/`k` below while keeping the arrow aliases.
# Counts compose with motions (`10j`, `3Ctrl+d`, `25gg`). Mod means Command
# on macOS and Control elsewhere. `<char>` waits for the following printable key.
# Spaces delimit successive key tokens: `m <char>` is typed `ma`, without Space.
[keybindings]
sequence-timeout-ms = 750 # Chord wait; counts/unambiguous final <char> do not expire. Range: 100..5000.
scroll-left = ["h", "ArrowLeft"]
scroll-down = ["j", "Ctrl+e", "ArrowDown"]
scroll-up = ["k", "Ctrl+y", "ArrowUp"]
scroll-right = ["l", "ArrowRight"]
five-lines-down = [] # Compatibility action; J is the configurable 5j alias below.
five-lines-up = []   # Compatibility action; K is the configurable 5k alias below.
half-page-down = "Ctrl+d"
half-page-up = "Ctrl+u"
full-page-down = ["Space", "Ctrl+f", "PageDown"]
full-page-up = ["b", "Ctrl+b", "PageUp"]
jump-back = "Ctrl+o"
jump-forward = "Ctrl+i"
previous-place = [] # Deprecated compatibility name for jump-back.
go-top = ["g g", "Home"]
go-bottom = ["G", "End"]
horizontal-start = "0"
horizontal-end = "$"
previous-paragraph = "{"
next-paragraph = "}"
previous-heading = "[ ["
next-heading = "] ]"
align-anchor-top = "z t"
align-anchor-center = "z z"
align-anchor-bottom = "z b"
open-search = "/"
open-search-backward = "?"
open-command = ":"
search-next = "n"
search-previous = "N"
search-word-forward = "*"
search-word-backward = "#"
set-mark = "m <char>"
jump-mark-line = "' <char>"
jump-mark-exact = "` <char>"
toggle-toc = "t"
toggle-topbar = "B"
toggle-crop = "c"
close-viewer = "q"
page-a4 = "p 4"
page-dynamic = "d"
zoom-in = ["+", "Mod+=", "Mod++"]
zoom-out = ["-", "_", "Mod+-", "Mod+_"]
zoom-reset = ["z 0", "Mod+0"]
zoom-fit-width = "="
browser-print = "Mod+p"
toggle-margin = ["Ctrl+m", "Meta+m"]

# Fixed viewer buttons have no built-in shortcut, but can be assigned here.
toggle-keys = []
toggle-lines = []
open-macros = []
open-config = []
toggle-log = []
toggle-theme = []
proof-main = []
proof-supporting = []
proof-all = []
print-pdf = []
restart-server = []
stop-server = []

# Aliases expand to configured bindings and multiply typed counts. For example,
# `3J` resolves to `15j`. Use [] to remove an inherited alias (and leave that
# key untouched for the browser or an extension).
[keybindings.aliases]
J = "5j"
K = "5k"
"Shift+Space" = "b" # Matching page-up distance; follows the configured b motion.
