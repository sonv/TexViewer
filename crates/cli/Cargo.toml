[package]
name = "mathpreview-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Live-rendering LaTeX and Markdown preview daemon for Neovim (the companion binary to the mathpreview.nvim plugin). Serves an interactive HTML view over WebSocket with source sync, clickable cross-references, and a pinned-margin column."
keywords = ["latex", "markdown", "preview", "mathjax", "neovim"]
categories = ["command-line-utilities", "rendering", "web-programming::http-server"]

[lib]
name = "mathpreview_cli"
path = "src/lib.rs"

[[bin]]
name = "mathpreview-cli"
path = "src/main.rs"

[dependencies]
mathpreview-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures-util.workspace = true
memory-stats.workspace = true
libc.workspace = true
include_dir.workspace = true
toml_edit.workspace = true
