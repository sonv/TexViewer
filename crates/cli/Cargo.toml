[package]
name = "mathpreview-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Live-rendering LaTeX preview daemon for nvim/vimtex (the companion binary to the mathpreview.nvim plugin). Serves an interactive HTML view over WebSocket with role-tagged proofs, clickable cross-references, and a pinned-margin column."
keywords = ["latex", "preview", "mathjax", "neovim", "vimtex"]
categories = ["command-line-utilities", "rendering", "web-programming::http-server"]

[lib]
name = "mathpreview_cli"
path = "src/lib.rs"

[[bin]]
name = "mathpreview-cli"
path = "src/main.rs"

# `locus` — the native-window viewer as its own command (`locus <file>`).
# Only built/installed with `--features gui`, so a default install is just the
# `mathpreview-cli` daemon.
[[bin]]
name = "locus"
path = "src/bin/locus.rs"
required-features = ["gui"]

[dependencies]
mathpreview-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures-util.workspace = true
memory-stats.workspace = true
libc.workspace = true
include_dir.workspace = true
toml_edit.workspace = true

# Native webview window — opt-in via `--features gui`, so the default build
# (and the release cross-build for 4 targets) stays a pure daemon with no
# webview system deps. `mathpreview-cli view <file>` then opens the preview in
# a native window instead of a browser tab.
wry = { workspace = true, optional = true }
tao = { workspace = true, optional = true }

# Dock icon for the Locus window: a bare binary (no .app bundle) shows the
# generic executable icon, so view.rs sets NSApp.applicationIconImage at
# runtime. Both crates are already in the gui dependency tree via tao — these
# direct deps pin the same locked versions and only add feature flags.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData"] }

[features]
default = []
gui = ["dep:wry", "dep:tao", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
