[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.24"
edition = "2021"
license = "MIT"
repository = "https://github.com/sonv/TexViewer"
homepage = "https://github.com/sonv/TexViewer"
authors = ["Truong-Son Van <van.truongson@gmail.com>"]
readme = "README.md"
rust-version = "1.82"

[profile.release]
# Cross-crate inlining is worth the extra link time for a perf-sensitive
# parser + renderer like this. `thin` keeps incremental rebuilds usable
# locally while still getting most of the speedup of `fat`.
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow    = "1"
thiserror = "1"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
toml      = "0.8"
toml_edit = "0.22"
regex     = "1"
walkdir   = "2"
clap      = { version = "4", features = ["derive"] }
axum      = { version = "0.7", features = ["ws"] }
tokio     = { version = "1", features = ["full"] }
notify    = "6"
notify-debouncer-full = "0.3"
futures-util = "0.3"
memory-stats = "1"
libc = "0.2"
include_dir = "0.7"
mathpreview-core = { path = "crates/core" }
