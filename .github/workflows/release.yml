# GitHub Actions release workflow.
#
# Fires on a `v*` tag push (the real release path) or on a manual
# "Run workflow" click from the Actions tab (the dry-run path, useful
# for verifying the matrix works without burning a real version number).
#
# What it does:
#   1. Build the `mathpreview-cli` daemon in release mode for four target
#      triples in parallel: macOS arm64, macOS x86_64, Linux x86_64, Linux arm64.
#   2. Strip each binary, tarball it, generate a SHA-256 checksum, and upload it
#      as an artifact.
#   3. Once all builds succeed, create a *draft* GitHub Release at the pushed
#      tag with every tarball attached and auto-generated notes.
#
# The release is left as a draft so you can review the artifacts, edit
# the auto-generated notes, and click "Publish release" yourself.
# Nothing the workflow produces is visible to users until you do that.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name for a manual dry run. Leave blank to use v<Cargo.toml version>; if set, it must match that version."
        required: false
        default: ""

# Opt every JavaScript-based action in this workflow into the Node.js 24
# runtime now. As of mid-2026 the major actions/* releases (checkout,
# cache, upload-artifact, download-artifact) are still pinned to Node 20
# internally; GitHub starts forcing the Node 24 default on 2026-06-02
# and removes Node 20 from runners on 2026-09-16. Setting this env var
# at the workflow level makes the switch deterministic — no surprise
# behaviour change on the rollout date, and the deprecation warnings
# stop appearing in run logs.
#
# When upstream ships v5+ of these actions (which target Node 24
# natively), bump the @v4 pins below and this env var can come out.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least privilege: default the whole workflow's GITHUB_TOKEN to no scopes, then
# grant only what each job needs. The build job only checks out code; the
# release job needs `contents: write` to create the draft release.
permissions: {}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS x86_64 is cross-compiled from arm64. GitHub dropped the
        # `macos-13` Intel runners from the free tier in 2024–25, so we
        # build both Apple targets on `macos-14` (Apple Silicon): the
        # arm64 build runs natively, the x86_64 build uses Rust's
        # cross-compile path against Apple's universal SDK. Linux
        # x86_64 and arm64 each build natively on their own runner.
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            cross_compile: false
          - os: macos-14
            target: x86_64-apple-darwin
            cross_compile: true   # arm64 host → x86_64 darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross_compile: false
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cross_compile: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            [[ -n "$TAG" ]] || TAG="v$VERSION"
          else
            TAG="$REF_NAME"
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned 2026-06-25)
        with:
          targets: ${{ matrix.target }}

      # Cross-compiled macOS x86_64 binaries can't execute on an arm64
      # host without Rosetta 2 — which isn't pre-installed on macos-14
      # runners. Install it just for that one matrix entry so the
      # `cargo test --target …` step below works. ~30 s, runs once.
      - name: Install Rosetta 2 (x86_64 macOS cross-compile only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      # Sanity check before producing a binary that gets a release URL.
      # Pinned to the same target the binary will build for so any
      # target-specific breakage shows up here, not at runtime.
      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }} --workspace

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p mathpreview-cli

      # README and the installer promise that GNU/Linux artifacts run with
      # glibc 2.34+. Building on Ubuntu 22.04 alone does not enforce that ABI:
      # a future dependency could import a newer symbol without failing CI.
      - name: Enforce Linux glibc 2.34 ceiling
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/mathpreview-cli"
          GLIBC_NODES=$(
            readelf --version-info "$BINARY" \
              | grep -oE 'GLIBC_[A-Za-z0-9_.]+' \
              | sort -u
          )
          NONNUMERIC=$(printf '%s\n' "$GLIBC_NODES" \
            | grep -Ev '^GLIBC_[0-9]+(\.[0-9]+)*$' || true)
          if [[ -n "$NONNUMERIC" ]]; then
            echo "$BINARY imports unsupported glibc ABI nodes:" >&2
            echo "$NONNUMERIC" >&2
            exit 1
          fi
          MAX_GLIBC=$(printf '%s\n' "$GLIBC_NODES" | sort -V | tail -1)
          if [[ "$(printf '%s\n' GLIBC_2.34 "$MAX_GLIBC" | sort -V | tail -1)" != "GLIBC_2.34" ]]; then
            echo "$BINARY requires $MAX_GLIBC; release ceiling is GLIBC_2.34" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # The tag drives the archive name. On tag-triggered runs github.ref_name
          # is "v0.1.0"; on workflow_dispatch it's the manual input.
          TAG="${{ steps.release.outputs.tag }}"
          NAME="mathpreview-cli-${TAG}-${{ matrix.target }}"
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/mathpreview-cli" staging/
          # Strip release symbols. Skipped on Apple silicon arm64 cross
          # builds — Linux strip can mangle Mach-O — but native macOS
          # strip handles its own binaries fine.
          strip staging/mathpreview-cli || true
          (cd staging && tar czf "../dist/${NAME}.tar.gz" mathpreview-cli)
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          ls -lh dist/

      # Exercise the same checksum, one-file archive, executable, and exact
      # --version checks that the nvim plugin uses. Serving the just-built
      # files through curl's file:// transport catches any drift between the
      # release naming contract and scripts/install-prebuilt.sh before upload.
      - name: Verify prebuilt installer contract
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          RELEASE_ROOT="$RUNNER_TEMP/mathpreview-release"
          INSTALL_ROOT="$RUNNER_TEMP/mathpreview-install"
          mkdir -p "$RELEASE_ROOT/$TAG"
          cp dist/* "$RELEASE_ROOT/$TAG/"
          MATHPREVIEW_RELEASE_BASE_URL="file://$RELEASE_ROOT" \
            sh scripts/install-prebuilt.sh \
              "$VERSION" "$INSTALL_ROOT" "${{ matrix.target }}"
          test -x "$INSTALL_ROOT/bin/mathpreview-cli"
          test "$("$INSTALL_ROOT/bin/mathpreview-cli" --version)" = \
            "mathpreview-cli $VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [build]
    # Skip the GitHub-Release step on manual dry runs: artifacts upload
    # to the Actions tab where you can download them, but no Releases
    # entry is created. Only real tag pushes create draft releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          # Auto-generated release notes from commits since the previous tag.
          # Edit them in the GitHub UI before clicking Publish.
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
